name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  # Manual trigger, mirroring ci.yml. Added after the 2026-08-06 Actions incident
  # throttled webhook delivery, so pull_request events stopped creating runs and a
  # pushed commit could not be reviewed at all. A dispatch carries no PR context,
  # hence the explicit PR number.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to review"
        required: true
        type: string

jobs:
  review:
    # PR events (opened/synchronize) review, as does an explicit manual dispatch. A comment
    # only triggers a re-review when it @claude-mentions on a pull request (not a plain issue).
    #
    # Every path is additionally gated on the actor being trusted, because the checkout step
    # below pulls the PR head into the workspace root while the comment/dispatch paths run in
    # the BASE repo context with this repo's secrets (CodeQL: actions/untrusted-checkout/high).
    # The repo is public, so without this any fork author could aim the review agent at their
    # own code. `workflow_dispatch` needs write access to trigger at all, so it needs no guard.
    #
    # Fork PRs: the automatic `pull_request` path never reviews a fork (GitHub withholds secrets
    # from fork `pull_request` runs, and the author-association gate blocks non-collaborators),
    # so the "Refuse un-requested fork PRs" step below fails it with a clear error. A trusted
    # maintainer CAN review a fork PR on demand -- by @claude-commenting it or via
    # workflow_dispatch -- because those paths gate on the maintainer, not the PR author; they
    # deliberately check out untrusted fork code beside secrets, bounded by the tight
    # --allowedTools list below. This gate covers who may ASK; the refuse step covers whose
    # code the AUTOMATIC path will run.
    #
    # Known gap: Dependabot PRs have author_association CONTRIBUTOR, so they do NOT match and
    # are skipped silently. That is deliberate — GitHub withholds secrets from
    # Dependabot-triggered `pull_request` runs, so CLAUDE_CODE_OAUTH_TOKEN would be empty and
    # the job could only fail. Dependency PRs (see .github/dependabot.yml) are reviewed by
    # hand; re-run one through `workflow_dispatch` to get an automated pass over it.
    if: >-
      (github.event_name == 'pull_request' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # A fork's head is untrusted code. The automatic `pull_request` path never reviews it:
      # GitHub withholds secrets from fork `pull_request` runs (the token would be empty), and
      # the `if:` above already requires a trusted author. This step gives that path a clear
      # error instead of a cryptic empty-token failure -- hence `if: pull_request` only.
      #
      # The `workflow_dispatch` and `@claude`-comment paths are gated on a trusted MAINTAINER
      # (not the PR author), run in the BASE repo context with this repo's secrets, and DO
      # check out the fork head via `refs/pull/N/head`. Those paths intentionally skip this
      # step: a maintainer may review a fork PR on demand, accepting the untrusted checkout,
      # which is bounded by the tight `--allowedTools` list below (no arbitrary Bash, no
      # network egress). See claude-code-action's docs/security.md on untrusted refs.
      - name: Refuse un-requested fork PRs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          head_repo=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .head.repo.full_name)
          if [ "$head_repo" != "${{ github.repository }}" ]; then
            echo "::error::PR head lives in $head_repo, not ${{ github.repository }}. A trusted maintainer can review a fork PR on demand: comment @claude on it, or run this workflow via workflow_dispatch with its PR number."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # On an @claude comment, and on a manual dispatch, the event ref is the
          # default branch, so check out the PR head explicitly; pull_request
          # events keep their default.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr) || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || '') }}
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} 
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Review the diff yourself, directly, in THIS turn, and post every comment
            before you finish. This runs inside a GitHub Actions job that is torn down
            the instant your turn ends, so any work left running in the background is
            killed before it can post.
            - Do NOT invoke the `/code-review` skill (or any skill/command that runs the
              review as a background or multi-agent workflow).
            - Do NOT spawn background subagents or defer the review with the Task tool.
            - Do NOT end your turn saying you will "report back later" or that a review
              is "still running" - there is no later. If you say you posted comments,
              they must already be posted.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

          # Full output kept on so the run log shows any tool the agent gets denied;
          # flip back to false once reviews are posting reliably again.
          show_full_output: true

          # Broadened beyond the stock example: the v2.1.x review agent explores
          # the checked-out branch with Read/Grep/Glob and git inspection, so the
          # old minimal allowlist got it blocked (67 denials) and it never posted.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Read,Grep,Glob"
