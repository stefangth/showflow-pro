name: CI

on:
  pull_request:
    branches: ["**"]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  # ── 1b. Typecheck (tsc) ────────────────────────────────────────────────────
  # eslint does not type-check. This catches type-level breakage that lint
  # misses — e.g. reading a property that was removed from an interface, or a
  # dangling import after a file is deleted. Dev-targeted PRs do not run the
  # build (only the main-only e2e job does), so without this a type error could
  # slip through to a much later stage. Uses the app project's own config
  # (noEmit already set), which includes src/.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc -p tsconfig.app.json --noEmit

  # ── 2. Unit / hook tests (Vitest) ──────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Vitest
        run: npm test

  # ── 3. Database tests (pgTAP) ──────────────────────────────────────────────
  # Boots the local Supabase Postgres stack, applies all migrations, and runs
  # pgTAP tests under supabase/tests/ via `supabase test db`.
  db-tests:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so pgTAP/migration behavior cannot change underneath CI.
          # Bump intentionally when upgrading the local Supabase stack.
          version: 2.98.2

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start Supabase local stack
        id: start
        run: |
          set -o pipefail
          supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector 2>&1 | tee /tmp/supabase-start.log

      - name: Show what's running
        if: always()
        run: |
          echo "─── docker ps ───"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "─── supabase status ───"
          supabase status || true

      - name: Dump container logs on start failure
        if: failure() && steps.start.outcome == 'failure'
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep -i supabase); do
            echo "═══════════════════════════════════"
            echo "── $c ──"
            echo "═══════════════════════════════════"
            docker logs --tail 300 "$c" 2>&1 || true
          done
          echo "─── tail of supabase start output ───"
          tail -200 /tmp/supabase-start.log || true

      - name: Run pgTAP tests
        id: tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log

      - name: Dump pgTAP output and postgres logs on test failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "─── full pgTAP output ───"
          cat /tmp/pgtap.log || true
          echo "─── postgres container logs (last 200) ───"
          for c in $(docker ps --format '{{.Names}}' | grep -iE 'db|postgres'); do
            echo "── $c ──"
            docker logs --tail 200 "$c" 2>&1 || true
          done

  # ── 4. Edge function tests (Deno) ──────────────────────────────────────────
  function-tests:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Keep function test type-check/runtime behavior reproducible.
          deno-version: v2.5.6

      - name: Run Deno function tests
        # `--node-modules-dir=none` makes Deno resolve `npm:` specifiers (e.g.
        # `npm:@supabase/supabase-js@2` in _shared/deps.ts) from its own global
        # cache instead of expecting a local node_modules/. The root package.json
        # otherwise forces Deno into node_modules mode, which this job does not
        # populate (no npm ci), causing "Could not find ... in a node_modules folder".
        run: deno test --allow-all --node-modules-dir=none supabase/functions/

  # ── 5. End-to-end tests (Playwright) ──────────────────────────────────────
  # Two scripted happy paths (signup→approval, booking lifecycle). Only runs
  # on pull requests targeting `main` — these are the integration-bug net.
  # Boots a local Supabase stack, runs the Vite dev server against it, and
  # exercises the UI end-to-end.
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Start Supabase local stack
        id: start
        run: |
          set -o pipefail
          supabase start -x studio,inbucket,imgproxy,logflare,vector 2>&1 | tee /tmp/supabase-start.log

      - name: Export Supabase env
        run: |
          # `supabase status -o env` prints quoted KEY=VALUE pairs we can `eval`.
          # The keys are API_URL / ANON_KEY / SERVICE_ROLE_KEY on the version pinned above.
          echo "── raw supabase status -o env ──"
          supabase status -o env
          echo "─────────────────────────────────"
          eval "$(supabase status -o env)"
          : "${API_URL:?supabase status did not return API_URL}"
          : "${ANON_KEY:?supabase status did not return ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status did not return SERVICE_ROLE_KEY}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=local"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app
        run: npm run build

      - name: Start preview server
        run: |
          # Background `vite preview` and poll until it answers — avoids pulling
          # in `wait-on` just for one check.
          nohup npx vite preview --port 5173 --host 127.0.0.1 \
            > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173 > /dev/null; then
              echo "preview up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview never came up; dumping log:"
          cat /tmp/vite-preview.log
          exit 1

      - name: Run Playwright
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "─── supabase status ───"
          supabase status || true
          echo "─── vite preview log ───"
          tail -200 /tmp/vite-preview.log || true
          echo "─── docker ps ───"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "─── edge-runtime logs (last 200) ───"
          for c in $(docker ps -a --format '{{.Names}}' | grep -iE 'edge|functions'); do
            echo "── $c ──"
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
