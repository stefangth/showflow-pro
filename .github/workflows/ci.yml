name: CI

# Runs on every PR, and also on the merged commit once it lands on `main`.
# The `push: main` trigger exists so the edge-function deploy can gate on a green
# CI run of the *merged* result (see deploy-functions.yml's `workflow_run` trigger):
# on a private/free-plan repo required status checks aren't available, so this is
# how we guarantee the merged commit was actually tested before it deploys.
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  # Manual trigger. During the 2026-08-06 GitHub Actions incident, webhook
  # delivery was throttled and push/pull_request events silently failed to
  # create runs, leaving commits untestable with no way to launch CI by hand.
  # Note GitHub only offers this for workflows present on the DEFAULT branch,
  # so it becomes usable once this lands on `main`.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to test (defaults to the branch the run is dispatched on)"
        required: false
        type: string


# Least privilege for every job below: CI only ever checks out the repo and uploads an
# artifact, and never calls `gh` or the API, so a read-only token is sufficient. Without this
# the workflow inherits the repository default, which CodeQL flags
# (actions/missing-workflow-permissions). Any job that later needs to write (post a comment,
# push a tag) should declare its own job-level `permissions:` rather than widening this.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret scan can inspect EACH pushed commit's
          # diff, not just the tip tree — catches a secret added then removed
          # within the same PR (it stays in permanent history regardless).
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Enforce npm-only root lockfile
        run: node scripts/check-package-manager.mjs

      - run: npm ci

      # Runs on every PR/push, INCLUDING cloud-session commits and any
      # `git push --no-verify` bypass — the layer that catches a hardcoded
      # credential a local pre-push hook can never see. Scans the tip tree, and
      # on a PR the added lines of every commit in the range. See scripts/scan-secrets.mjs.
      - name: Scan for committed secrets
        run: |
          node scripts/scan-secrets.mjs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/scan-secrets.mjs --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fi

      - name: Check generated mirrors are in sync
        run: npm run sync:mirrors:check

      - run: npm run lint

  # ── 1b. Typecheck + build (tsc, vite) ──────────────────────────────────────
  # eslint does not type-check. This catches type-level breakage that lint
  # misses — e.g. reading a property that was removed from an interface, or a
  # dangling import after a file is deleted.
  typecheck:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The app project (include: ["src"]).
      - name: Typecheck app (tsc --noEmit)
        run: npx tsc -p tsconfig.app.json --noEmit

      # Everything outside src/ that the app project cannot see: the e2e specs
      # and helpers, the scripts/ vitest tests, and the build configs. Vitest
      # and Playwright both transpile without type-checking, so without this a
      # type error in e2e/ surfaced only on a main-targeted PR (when Playwright
      # actually runs) and one in scripts/ surfaced never.
      - name: Typecheck tools (tsc --noEmit)
        run: npx tsc -p tsconfig.tools.json --noEmit

      # tsc does not catch bundler-level failures (import resolution, a Vite
      # plugin, an asset path). The build previously ran ONLY inside the e2e
      # job, which is main-targeted-PRs-only — so on every other PR a
      # build-breaking change went green. ~5s, no env needed.
      - name: Build
        run: npm run build

  # ── 2. Unit / hook tests + coverage gate (Vitest) ──────────────────────────
  # Runs the suite ONCE, under `--coverage`. The thresholds in vitest.config.ts
  # only apply when `--coverage` is passed, so a plain `vitest run` would leave
  # the ratchet decorative — but running both `npm test` and `npm run
  # test:coverage` in separate jobs just executed the same 1700+ tests twice
  # (the coverage run is a strict superset). One job, one run, both signals: a
  # failing test and a coverage drop below the configured thresholds each fail
  # this job.
  unit-tests:
    name: Unit tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Vitest with coverage (enforces thresholds)
        run: npm run test:coverage

  # ── 3. Database tests (pgTAP) ──────────────────────────────────────────────
  # Boots the local Supabase Postgres stack, applies all migrations, and runs
  # pgTAP tests under supabase/tests/ via `supabase test db`.
  db-tests:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Unpinned: installs the latest Supabase CLI, so CI tracks the same version
      # developers get from brew instead of freezing on an old release. This is
      # safe because the schema/tests were made CLI-version-independent — the
      # explicit table-grants migration (…_grant_public_table_privileges_to_roles)
      # and the [auth] redirect block in supabase/config.toml — rather than relying
      # on a specific CLI's default grant/auth bootstrap.
      - uses: supabase/setup-cli@v3

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start Supabase local stack
        id: start
        run: |
          set -o pipefail
          supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector 2>&1 | tee /tmp/supabase-start.log

      - name: Show what's running
        if: always()
        run: |
          echo "─── docker ps ───"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "─── supabase status ───"
          supabase status || true

      - name: Dump container logs on start failure
        if: failure() && steps.start.outcome == 'failure'
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep -i supabase); do
            echo "═══════════════════════════════════"
            echo "── $c ──"
            echo "═══════════════════════════════════"
            docker logs --tail 300 "$c" 2>&1 || true
          done
          echo "─── tail of supabase start output ───"
          tail -200 /tmp/supabase-start.log || true

      - name: Run pgTAP tests
        id: tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log

      - name: Dump pgTAP output and postgres logs on test failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "─── full pgTAP output ───"
          cat /tmp/pgtap.log || true
          echo "─── postgres container logs (last 200) ───"
          for c in $(docker ps --format '{{.Names}}' | grep -iE 'db|postgres'); do
            echo "── $c ──"
            docker logs --tail 200 "$c" 2>&1 || true
          done

  # ── 4. Edge function tests (Deno) ──────────────────────────────────────────
  function-tests:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          # Keep function test type-check/runtime behavior reproducible.
          deno-version: v2.5.6

      # `deno test` only type-checks what its test files actually import, so an
      # untested (or newly added, not-yet-tested) function would never be
      # type-checked at all — and tsc does not cover the edge runtime
      # (see CLAUDE.md, "Regenerating the types"). This checks every entrypoint
      # explicitly, plus the two Deno operator scripts under scripts/, which no
      # other job touches.
      - name: Typecheck edge functions and Deno scripts
        run: |
          deno check --node-modules-dir=none supabase/functions/*/index.ts
          deno check --node-modules-dir=none \
            scripts/changelog-to-json.ts scripts/upload-hire-order-fonts.ts

      - name: Run Deno function tests
        # `--node-modules-dir=none` makes Deno resolve `npm:` specifiers (e.g.
        # `npm:@supabase/supabase-js@2` in _shared/deps.ts) from its own global
        # cache instead of expecting a local node_modules/. The root package.json
        # otherwise forces Deno into node_modules mode, which this job does not
        # populate (no npm ci), causing "Could not find ... in a node_modules folder".
        run: deno test --allow-all --node-modules-dir=none supabase/functions/

  # ── 5. End-to-end tests (Playwright) ──────────────────────────────────────
  # Two scripted happy paths (signup→approval, booking lifecycle). Only runs
  # on pull requests targeting `main` — these are the integration-bug net.
  # Boots a local Supabase stack, runs the Vite dev server against it, and
  # exercises the UI end-to-end.
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unpinned — see the db-tests job above for why this is safe.
      - uses: supabase/setup-cli@v3

      - name: Start Supabase local stack
        id: start
        run: |
          set -o pipefail
          supabase start -x studio,inbucket,imgproxy,logflare,vector 2>&1 | tee /tmp/supabase-start.log

      - name: Export Supabase env
        run: |
          # `supabase status -o env` prints quoted KEY=VALUE pairs we can `eval`.
          # The keys are API_URL / ANON_KEY / SERVICE_ROLE_KEY on the version pinned above.
          echo "── raw supabase status -o env ──"
          supabase status -o env
          echo "─────────────────────────────────"
          eval "$(supabase status -o env)"
          : "${API_URL:?supabase status did not return API_URL}"
          : "${ANON_KEY:?supabase status did not return ANON_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status did not return SERVICE_ROLE_KEY}"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "VITE_SUPABASE_PROJECT_ID=local"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app
        run: npm run build

      - name: Start preview server
        run: |
          # Background `vite preview` and poll until it answers — avoids pulling
          # in `wait-on` just for one check.
          nohup npx vite preview --port 5173 --host 127.0.0.1 \
            > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173 > /dev/null; then
              echo "preview up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview never came up; dumping log:"
          cat /tmp/vite-preview.log
          exit 1

      - name: Run Playwright
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npx playwright test --config=e2e/playwright.config.ts

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "─── supabase status ───"
          supabase status || true
          echo "─── vite preview log ───"
          tail -200 /tmp/vite-preview.log || true
          echo "─── docker ps ───"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "─── edge-runtime logs (last 200) ───"
          for c in $(docker ps -a --format '{{.Names}}' | grep -iE 'edge|functions'); do
            echo "── $c ──"
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
