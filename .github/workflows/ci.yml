name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  # ── 2. Unit / hook tests (Vitest) ──────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Vitest
        run: npm test

  # ── 3. Database tests (pgTAP) ──────────────────────────────────────────────
  # Boots the local Supabase Postgres stack, applies all migrations, and runs
  # pgTAP tests under supabase/tests/ via `supabase test db`.
  db-tests:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so pgTAP/migration behavior cannot change underneath CI.
          # Bump intentionally when upgrading the local Supabase stack.
          version: 2.98.2

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Start Supabase local stack
        id: start
        run: |
          set -o pipefail
          supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector 2>&1 | tee /tmp/supabase-start.log

      - name: Show what's running
        if: always()
        run: |
          echo "─── docker ps ───"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "─── supabase status ───"
          supabase status || true

      - name: Dump container logs on start failure
        if: failure() && steps.start.outcome == 'failure'
        run: |
          for c in $(docker ps -a --format '{{.Names}}' | grep -i supabase); do
            echo "═══════════════════════════════════"
            echo "── $c ──"
            echo "═══════════════════════════════════"
            docker logs --tail 300 "$c" 2>&1 || true
          done
          echo "─── tail of supabase start output ───"
          tail -200 /tmp/supabase-start.log || true

      - name: Run pgTAP tests
        id: tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log

      - name: Dump pgTAP output and postgres logs on test failure
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          echo "─── full pgTAP output ───"
          cat /tmp/pgtap.log || true
          echo "─── postgres container logs (last 200) ───"
          for c in $(docker ps --format '{{.Names}}' | grep -iE 'db|postgres'); do
            echo "── $c ──"
            docker logs --tail 200 "$c" 2>&1 || true
          done

  # ── 4. Edge function tests (Deno) ──────────────────────────────────────────
  function-tests:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Keep function test type-check/runtime behavior reproducible.
          deno-version: v2.5.6

      - name: Run Deno function tests
        run: deno test --allow-all supabase/functions/

  # ── 5. End-to-end tests (Playwright) ──────────────────────────────────────
  # Only runs on pull requests to main. Scaffolded — filled in when
  # the Playwright happy-path specs land (plan item 17).
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: E2E suite not enabled until Phase 7
        run: |
          if [ -d e2e ] && find e2e -name '*.spec.ts' -print -quit | grep -q .; then
            echo "E2E specs are present, but the runnable Playwright stack is tracked by SFP-62 (Phase 7)."
            echo "Skipping instead of failing unrelated Phase 5 pull requests."
          else
            echo "No E2E tests yet — skipping."
          fi
