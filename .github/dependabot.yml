# Without this file Dependabot only ever raises *alerts*, never PRs — which is how 43 open
# alerts accumulated with nothing on the PR list. Everything here is grouped aggressively so a
# solo maintainer gets a couple of reviewable PRs a week rather than a PR per advisory.
#
# Scope note: this is a Vite SPA, so almost the entire dependency tree is build-time only. The
# packages that actually reach a browser are the React/Radix/router/recharts runtime set —
# those get their own group so a risky bump is never buried in a 40-package devDependency PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    # TypeScript majors are held back by the lint toolchain, not by preference. Every
    # published typescript-eslint (8.66.0 as of Aug 2026) still peers `typescript <6.1.0`,
    # so a bump to 7.x leaves `npm ci` unresolvable: PR #247 failed lint, typecheck, unit,
    # e2e AND the Vercel preview at dependency resolution, before one build step ran. There
    # is no version of the toolchain that accepts it, so the PR could not be made green by
    # bumping anything alongside it. Closing it alone would not hold — Dependabot re-raises
    # a closed PR for the next version, so 7.0.3 would return this Monday.
    # Remove this entry once typescript-eslint's peer range admits the major you want;
    # nothing else will remind you, which is the accepted cost of the ignore.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Radix MUST move as one family, and this group must stay FIRST — a dependency joins the
      # first group it matches, so `runtime-patches` below would otherwise claim the patch-level
      # Radix bumps and leave the minors behind.
      #
      # Why it matters: Radix's ~27 public packages share internals (react-dismissable-layer,
      # react-primitive, react-popper, …) whose versions must agree. Splitting them by
      # update-type strands the family across PRs whose caret ranges npm cannot dedupe, so the
      # tree ends up with two copies of a shared internal. That is not cosmetic: PR #245 split
      # `react-dismissable-layer` into 1.1.11 (under react-dialog) and 1.1.19 (under
      # react-popover), and because DismissableLayer coordinates nested layers through
      # module-scoped state, two copies meant two registries — a Dialog then treated a nested
      # Popover's own opening click as an outside click and dismissed it. Every combobox inside
      # a dialog or sheet stopped opening, in real Chromium, not just jsdom. 28 of 55 internals
      # were duplicated; `npm dedupe` cannot repair it because the un-bumped packages' ranges
      # genuinely cannot reach the new internals. Bumping the family together dedupes to 0.
      #
      # Includes minors deliberately: a patch-only rule is exactly what caused the split.
      radix:
        patterns: ["@radix-ui/*"]
        update-types: ["minor", "patch"]
      # Build/test tooling: vite, vitest, eslint, tailwind, playwright, types. Never ships to
      # a user, so these can move together and are safe to merge on a green CI run.
      dev-tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
      # Shipped runtime code. Patch-only as a group; a minor or major on anything a user's
      # browser executes gets its own PR so it can be reviewed and exercised on its own.
      runtime-patches:
        dependency-type: production
        update-types: ["patch"]
      # Security updates are a SEPARATE stream and groups default to
      # `applies-to: version-updates`, so the two groups above do not cover them. Dependabot
      # security updates are currently off (Settings > Code security); without this group,
      # switching them on would open one ungrouped PR per advisory — and
      # `open-pull-requests-limit` does not apply to that stream, so nothing would cap the
      # burst. Keep both streams grouped so enabling the setting stays a one-click decision.
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
